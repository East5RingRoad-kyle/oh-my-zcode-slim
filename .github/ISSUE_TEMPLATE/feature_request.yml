name: Feature request
description: Suggest a new subagent, routing behavior, skill, or documentation improvement.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement. One issue per idea keeps triage simple.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the workflow you are trying to do and why the current project does not cover it.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What should be added or changed (new role, routing rule, skill, docs, packaging)?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you considered, if any.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: I am willing to submit a pull request for this.
        - label: This changes agent permission boundaries.
        - label: This requires a version bump.
